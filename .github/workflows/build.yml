name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: this APK is signed with a throwaway key and cannot update an installed app. See README."
          fi
      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: shopping-list-apk
          path: app/build/outputs/apk/release/*.apk
      # Keeps one release, always holding the newest APK, at a fixed address:
      # https://github.com/<owner>/<repo>/releases/latest
      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk shopping-list.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest shopping-list.apk \
            --target "$GITHUB_SHA" \
            --title "Shopping List 1.0.$GITHUB_RUN_NUMBER" \
            --notes "Newest build of the app. Download shopping-list.apk on your phone and open it to install."
